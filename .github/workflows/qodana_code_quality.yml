# Qodana は on-pull-request.yml / on-main-merge.yml とは別ファイルで管理する。
# 理由: Qodana は Docker コンテナ (jetbrains/qodana-jvm-android) を pull して
# JetBrains IDE エンジンを丸ごと起動するため、Gradle タスクを直接実行する
# 他のジョブとは性質が異なる（実行時間・専用シークレット・Cloud へのアップロードなど）。
# 別ファイルにするのが JetBrains 公式の推奨パターン。
name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # to check out the actual pull request commit, not the merge commit
          fetch-depth: 0  # a full history is required for pull request analysis
      - name: 'Qodana Scan'
        # NOTE: continue-on-error: true はすべてのエラー（認証失敗・ネットワーク障害・コード品質違反を含む）を
        # 無音で飲み込むため、このジョブはCIゲートとして機能しない。
        # AGP 9.2.1 が Qodana でサポートされたら continue-on-error を削除すること。
        # 対応状況は JetBrains YouTrack で "Qodana AGP 9.2" を検索して確認する。
        continue-on-error: true
        uses: JetBrains/qodana-action@d7b5ec2fbec32197ef447c450e00589ed5f34fd5 # v2026.1
        with:
          pr-mode: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_693445069 }}
